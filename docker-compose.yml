services:
  api1: &api
    image: ghcr.io/henrycunh/rinha26-rust:5dc7c88
    hostname: api1
    environment:
      PORT: "8080"
      INDEX_PATH: /app/references.ridx
      INDEX_MMAP: "0"
      FAST_SEARCH_POINTS: "70000"
      REPAIR_SEARCH_POINTS: "500000"
      REPAIR_SCORES: "234"
      SCORE5_REPAIR_RULE: fp70narrow
      IVF_GRID: "1"
      IVF_THRESHOLD: "4096"
      IVF_DIMS: "2,4"
      IVF_GLOBAL_PLAN: "1"
      AVX2_PREFIX4: "0"
      AVX2_PREFETCH_POINTS: "0"
      PACKED_HOT2: "0"
      FD_SOCKET_DIR: /sockets
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    <<: *api
    hostname: api2

  lb:
    image: ghcr.io/henrycunh/rinha26-rust:5dc7c88
    hostname: lb
    environment:
      PORT: "9999"
      LB_MODE: fd
      LB_FD_SOCKETS: /sockets/api1.sock,/sockets/api2.sock
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m,mode=1777
