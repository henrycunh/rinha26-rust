services:
  api1: &api
    image: ghcr.io/henrycunh/rinha26-rust:e664025
    platform: linux/amd64
    hostname: api1
    network_mode: "none"
    cpuset: "0"
    environment:
      PORT: "8080"
      API_EPOLL: "1"
      EPOLL_PREALLOC_FDS: "2048"
      EPOLL_PREALLOC_CONTROLS: "256"
      API_DIRECT_FD: "0"
      API_WORKERS: "192"
      TIMER_SLACK_NS: "1"
      MLOCK_CURRENT: "0"
      TCP_BACKLOG: "8192"
      TCP_BUSY_POLL_US: "0"
      FD_SOCKET_DIR: /sockets
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp=unconfined
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    <<: *api
    hostname: api2
    cpuset: "1"

  lb:
    image: ghcr.io/henrycunh/rinha26-rust:e664025
    platform: linux/amd64
    entrypoint: ["/app/fd-lb"]
    hostname: lb
    environment:
      PORT: "9999"
      LB_FD_SOCKETS: /sockets/api1.sock,/sockets/api2.sock
      MLOCK_CURRENT: "0"
      TCP_BACKLOG: "8192"
      TCP_QUICKACK: "1"
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp=unconfined
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m,mode=1777
