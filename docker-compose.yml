services:
  api1: &api
    build:
      context: .
    image: rinha-fraud:local
    platform: linux/amd64
    hostname: api1
    network_mode: "none"
    cpuset: "0"
    environment:
      PORT: "8080"
      API_EPOLL: "${API_EPOLL:-1}"
      EPOLL_PREALLOC_FDS: "${EPOLL_PREALLOC_FDS:-2048}"
      EPOLL_PREALLOC_CONTROLS: "${EPOLL_PREALLOC_CONTROLS:-256}"
      API_DIRECT_FD: "${API_DIRECT_FD:-0}"
      API_WORKERS: "${API_WORKERS:-192}"
      TIMER_SLACK_NS: "${TIMER_SLACK_NS:-1}"
      MLOCK_CURRENT: "${MLOCK_CURRENT:-0}"
      TCP_BACKLOG: "${TCP_BACKLOG:-8192}"
      TCP_BUSY_POLL_US: "${TCP_BUSY_POLL_US:-0}"
      FD_SOCKET_DIR: "${FD_SOCKET_DIR:-/sockets}"
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp=unconfined
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.45}"
          memory: "${API_MEMORY:-160MB}"

  api2:
    <<: *api
    hostname: api2
    cpuset: "1"

  lb:
    image: rinha-fraud:local
    platform: linux/amd64
    entrypoint: ["/app/fd-lb"]
    hostname: lb
    environment:
      PORT: "9999"
      LB_FD_SOCKETS: "${LB_FD_SOCKETS:-/sockets/api1.sock,/sockets/api2.sock}"
      MLOCK_CURRENT: "${MLOCK_CURRENT:-0}"
      TCP_BACKLOG: "${TCP_BACKLOG:-8192}"
      TCP_QUICKACK: "${TCP_QUICKACK:-1}"
      LB_WORKERS: "${LB_WORKERS:-4}"
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp=unconfined
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "${LB_CPUS:-0.10}"
          memory: "${LB_MEMORY:-30MB}"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m,mode=1777
