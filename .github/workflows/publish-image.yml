name: publish image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push amd64 image
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/rinha26-rust"
          tag="${GITHUB_SHA::7}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$image:latest" \
            --tag "$image:$tag" \
            .
