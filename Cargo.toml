[package]
name = "rinha-fraud"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[dependencies]
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
smallvec = { version = "1.15", features = ["serde"] }
